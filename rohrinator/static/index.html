<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohrinator - Pipe Assembly Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rohrinator</h1>
            <p>Parametric Pipe Assembly Generator</p>
        </header>

        <div class="main-content">
            <!-- Configuration Panel -->
            <div class="config-panel">
                <h2>Configuration</h2>

                <!-- Assembly Type Selection -->
                <div class="form-group">
                    <label for="assembly-type">Assembly Type</label>
                    <select id="assembly-type">
                        <option value="straight">Straight Pipe</option>
                        <option value="elbow">90° Elbow</option>
                    </select>
                </div>

                <!-- Common Parameters -->
                <div class="form-section">
                    <h3>Pipe Parameters</h3>

                    <div class="form-group">
                        <label for="nps">Nominal Pipe Size (NPS)</label>
                        <select id="nps">
                            <option value="1/2">1/2"</option>
                            <option value="3/4">3/4"</option>
                            <option value="1">1"</option>
                            <option value="1-1/4">1-1/4"</option>
                            <option value="1-1/2">1-1/2"</option>
                            <option value="2" selected>2"</option>
                            <option value="2-1/2">2-1/2"</option>
                            <option value="3">3"</option>
                            <option value="4">4"</option>
                            <option value="6">6"</option>
                            <option value="8">8"</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pressure-class">Pressure Class</label>
                        <select id="pressure-class">
                            <option value="150" selected>Class 150</option>
                            <option value="300">Class 300</option>
                            <option value="600">Class 600</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="schedule">Pipe Schedule</label>
                        <select id="schedule">
                            <option value="STD" selected>STD</option>
                            <option value="40">Sch 40</option>
                            <option value="80">Sch 80</option>
                            <option value="XS">XS</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="welding-gap">Welding Gap (mm)</label>
                        <input type="number" id="welding-gap" value="3.0" min="0" max="10" step="0.5">
                    </div>
                </div>

                <!-- Straight Pipe Parameters -->
                <div class="form-section" id="straight-params">
                    <h3>Straight Pipe Dimensions</h3>

                    <div class="form-group">
                        <label for="face-to-face">Face-to-Face Length (mm)</label>
                        <input type="number" id="face-to-face" value="500" min="200" max="5000" step="10">
                    </div>
                </div>

                <!-- Elbow Parameters -->
                <div class="form-section" id="elbow-params" style="display: none;">
                    <h3>Elbow Dimensions</h3>

                    <div class="form-group">
                        <label for="leg-a">Leg A Length (mm)</label>
                        <input type="number" id="leg-a" value="500" min="200" max="3000" step="10">
                    </div>

                    <div class="form-group">
                        <label for="leg-b">Leg B Length (mm)</label>
                        <input type="number" id="leg-b" value="500" min="200" max="3000" step="10">
                    </div>

                    <div class="form-group">
                        <label for="bend-radius">Bend Radius Factor</label>
                        <select id="bend-radius">
                            <option value="2D">2D (Short Radius)</option>
                            <option value="3D" selected>3D (Standard)</option>
                            <option value="5D">5D (Long Radius)</option>
                        </select>
                    </div>
                </div>

                <!-- Project Info -->
                <div class="form-section">
                    <h3>Project Info</h3>

                    <div class="form-group">
                        <label for="project">Project Name</label>
                        <input type="text" id="project" value="Project-001">
                    </div>

                    <div class="form-group">
                        <label for="designation">Designation</label>
                        <input type="text" id="designation" value="SPOOL-001">
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button id="generate-btn" class="btn btn-primary">Generate Assembly</button>
                </div>

                <!-- Download Links -->
                <div class="downloads" id="downloads" style="display: none;">
                    <h3>Downloads</h3>
                    <a id="download-step" class="btn btn-download" href="#" download>Download STEP</a>
                    <a id="download-stl" class="btn btn-download" href="#" download>Download STL</a>
                    <a id="download-bom" class="btn btn-download" href="#" target="_blank">View BOM</a>
                </div>

                <!-- Status -->
                <div id="status" class="status"></div>
            </div>

            <!-- 3D Preview Panel -->
            <div class="preview-panel">
                <h2>3D Preview</h2>
                <div id="viewer-container">
                    <div id="loading" class="loading" style="display: none;">
                        <div class="spinner"></div>
                        <span>Generating...</span>
                    </div>
                    <canvas id="viewer"></canvas>
                </div>
                <div class="viewer-controls">
                    <button id="reset-view" class="btn btn-small">Reset View</button>
                    <button id="toggle-wireframe" class="btn btn-small">Wireframe</button>
                </div>
            </div>
        </div>

        <!-- Assembly Info -->
        <div id="assembly-info" class="assembly-info" style="display: none;">
            <h3>Assembly Details</h3>
            <div id="bom-table"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
